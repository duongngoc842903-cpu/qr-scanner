<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quét QR vị trí</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif}
  body{display:flex;flex-direction:column}
  .head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#111;flex-shrink:0}
  .head button{width:42px;height:42px;border:0;border-radius:21px;background:#2a2a2a;color:#fff;font-size:20px}
  .head .title{font-weight:800}
  .wrap{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000}
  video{display:block;width:100%;height:100%;object-fit:cover;background:#000}
  canvas{display:none}
  .frame{
    position:absolute;left:50%;top:50%;width:min(76vw,340px);height:min(46vw,220px);
    transform:translate(-50%,-50%);border:3px solid rgba(255,255,255,.95);
    border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,.28),0 0 24px rgba(255,255,255,.22);
    pointer-events:none
  }
  .status{padding:10px 14px;background:#111;font-size:14px;line-height:1.45;min-height:46px}
  .actions{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#111}
  .actions button{flex:1;min-height:48px;border:0;border-radius:10px;font-size:15px;font-weight:700}
  #retry{display:none}
</style>
</head>
<body>
  <div class="head">
    <button type="button" onclick="closeScanner()">←</button>
    <div class="title">📷 Quét QR vị trí</div>
  </div>

  <div class="wrap" id="cameraWrap">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
    <div class="frame"></div>
  </div>

  <div class="status" id="status">Đang chuẩn bị camera…</div>

  <div class="actions">
    <button type="button" id="retry" onclick="startCamera()">🔄 Thử lại</button>
    <button type="button" onclick="closeScanner()">Đóng</button>
  </div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
'use strict';

// ============================================================
// Scanner.html — quét QR (tem Vị trí "VT:..." / Mã hàng "MH:...") rồi gửi chuỗi
// thô về cửa sổ mở nó (window.opener) qua postMessage {type:'QR_LOCATION_SCANNED', raw}.
//
// v2 — [TĂNG TỐC ĐỘ QUÉT] (giao thức gửi kết quả GIỮ NGUYÊN — trang kho không phải sửa)
//   • Dùng BarcodeDetector có sẵn của trình duyệt (Chrome Android) khi hỗ trợ QR —
//     nhanh và chịu ánh sáng/góc nghiêng tốt hơn jsQR nhiều. Không hỗ trợ (iPhone…)
//     -> tự quay về jsQR như cũ.
//   • jsQR: phân tích VÙNG GIỮA khung hình ở độ phân giải gốc (trước đây thu cả khung
//     xuống 900px -> tem ở xa chỉ còn vài pixel mỗi ô). Cứ vài lượt thử thêm cả khung
//     (thu nhỏ) để vẫn bắt được tem lệch khỏi khung trắng.
//   • jsQR: 'dontInvert' — tem in đen trên nền trắng, không cần thử đảo màu (gấp đôi
//     số lần quét mỗi giây so với 'attemptBoth').
//   • Xin 1080p + tự lấy nét liên tục trên máy hỗ trợ (máy không hỗ trợ tự bỏ qua).
// ============================================================

const CONFIG = {
  // Chỉ dùng khi bạn muốn khóa domain trang Apps Script.
  // Có thể để [] trong giai đoạn test.
  allowedParentOrigins: [],
  // Tỉ lệ cạnh vùng giữa (theo cạnh ngắn của khung hình) dùng để quét bằng jsQR —
  // phủ trọn khung trắng trên màn hình.
  tiLeVungGiua: 0.9,
  // Cạnh tối đa (px) của ảnh đưa vào jsQR — đủ chi tiết, vẫn nhanh trên máy yếu.
  canhToiDaJsQR: 720,
  // Cứ N lượt quét vùng giữa thì có 1 lượt quét cả khung hình (bắt tem lệch khung).
  moiNLuotQuetCaKhung: 4,
  nhipQuetMs: 100
};

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const statusEl = document.getElementById('status');
const retryBtn = document.getElementById('retry');

let stream = null;
let timer = null;
let scanning = false;
let sent = false;
let detector = null;   // BarcodeDetector nếu trình duyệt hỗ trợ QR
let luot = 0;

function setStatus(msg) {
  statusEl.textContent = msg;
}

function parentAllowed() {
  if (!window.opener) return false;
  if (!CONFIG.allowedParentOrigins.length) return true;
  try {
    return CONFIG.allowedParentOrigins.includes(document.referrer ? new URL(document.referrer).origin : '');
  } catch(e) {
    return true;
  }
}

function closeScanner() {
  stopCamera();
  try { window.close(); } catch(e) {}
  setTimeout(() => {
    setStatus('Có thể đóng tab này để quay lại màn hình kho.');
  }, 50);
}

function stopCamera() {
  scanning = false;
  if (timer) {
    clearTimeout(timer);
    timer = null;
  }
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  video.srcObject = null;
}

async function chooseCamera() {
  const devices = await navigator.mediaDevices.enumerateDevices();
  const cams = devices.filter(d => d.kind === 'videoinput');
  if (!cams.length) throw new Error('Không tìm thấy camera.');

  // Ưu tiên camera có tên sau/back/environment.
  const preferred = cams.find(d => /back|rear|environment|sau|sườn/i.test(d.label));
  return preferred ? preferred.deviceId : cams[0].deviceId;
}

// BarcodeDetector chỉ dùng khi trình duyệt khai báo có hỗ trợ định dạng QR.
async function taoDetector() {
  try {
    if (!('BarcodeDetector' in window)) return null;
    const formats = await window.BarcodeDetector.getSupportedFormats();
    if (!formats || formats.indexOf('qr_code') === -1) return null;
    return new window.BarcodeDetector({ formats: ['qr_code'] });
  } catch (e) {
    console.warn('BarcodeDetector không dùng được, chuyển sang jsQR:', e);
    return null;
  }
}

// Bật tự lấy nét liên tục nếu camera hỗ trợ — không hỗ trợ thì bỏ qua, không báo lỗi.
async function batLayNetLienTuc() {
  try {
    const track = stream && stream.getVideoTracks()[0];
    if (!track || !track.getCapabilities) return;
    const cap = track.getCapabilities();
    if (cap.focusMode && cap.focusMode.indexOf('continuous') !== -1) {
      await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
    }
  } catch (e) {
    console.warn('Không bật được lấy nét liên tục:', e);
  }
}

async function startCamera() {
  stopCamera();
  sent = false;
  luot = 0;
  retryBtn.style.display = 'none';

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setStatus('❌ Trình duyệt không hỗ trợ camera. Hãy mở bằng Chrome/Safari trên HTTPS.');
    retryBtn.style.display = 'block';
    return;
  }

  setStatus('Đang mở camera…');

  try {
    // Lần đầu: để browser tự chọn camera sau.
    const constraints = {
      audio: false,
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      }
    };

    try {
      stream = await navigator.mediaDevices.getUserMedia(constraints);
    } catch (e1) {
      const cameraId = await chooseCamera();
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { deviceId: { exact: cameraId }, width: { ideal: 1920 }, height: { ideal: 1080 } }
      });
    }

    video.srcObject = stream;
    await video.play();
    await batLayNetLienTuc();
    if (!detector) detector = await taoDetector();

    setStatus('✅ Camera đã mở. Đưa QR vị trí vào khung.');
    scanning = true;
    scanLoop();

  } catch (err) {
    console.error(err);
    const name = err && err.name ? err.name : '';
    let msg = '❌ Không mở được camera.';
    if (name === 'NotAllowedError' || name === 'SecurityError') {
      msg = '❌ Trình duyệt chưa cho phép camera. Hãy kiểm tra quyền Camera và mở trang bằng HTTPS.';
    } else if (name === 'NotFoundError') {
      msg = '❌ Không tìm thấy camera trên thiết bị.';
    } else if (name === 'NotReadableError') {
      msg = '❌ Camera đang bị ứng dụng khác sử dụng.';
    } else if (err && err.message) {
      msg += ' ' + err.message;
    }
    setStatus(msg);
    retryBtn.style.display = 'block';
  }
}

// jsQR trên 1 vùng (sx, sy, sw, sh) của khung hình video, thu nhỏ nếu vượt canhToiDaJsQR.
function quetJsQRVung(sx, sy, sw, sh) {
  if (!window.jsQR) return null;
  const scale = Math.min(1, CONFIG.canhToiDaJsQR / Math.max(sw, sh));
  const w = Math.max(1, Math.round(sw * scale));
  const h = Math.max(1, Math.round(sh * scale));
  canvas.width = w;
  canvas.height = h;
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, w, h);
  const image = ctx.getImageData(0, 0, w, h);
  const code = jsQR(image.data, w, h, { inversionAttempts: 'dontInvert' });
  return code && code.data ? code.data : null;
}

function quetJsQR() {
  const vw = video.videoWidth, vh = video.videoHeight;
  luot++;
  if (luot % CONFIG.moiNLuotQuetCaKhung === 0) {
    return quetJsQRVung(0, 0, vw, vh);                 // thỉnh thoảng quét cả khung
  }
  const canh = Math.round(Math.min(vw, vh) * CONFIG.tiLeVungGiua);
  return quetJsQRVung(Math.round((vw - canh) / 2), Math.round((vh - canh) / 2), canh, canh);
}

async function scanLoop() {
  if (!scanning || sent) return;
  if (video.readyState < 2 || video.videoWidth <= 0 || video.videoHeight <= 0) {
    timer = setTimeout(scanLoop, 150);
    return;
  }

  let data = null;
  try {
    if (detector) {
      const ds = await detector.detect(video);
      if (ds && ds.length && ds[0].rawValue) data = ds[0].rawValue;
    } else {
      data = quetJsQR();
    }
  } catch (e) {
    // BarcodeDetector lỗi giữa chừng (vài máy) -> chuyển hẳn sang jsQR, không dừng quét.
    console.warn('Lỗi khi quét, chuyển sang jsQR:', e);
    detector = null;
  }

  if (!scanning || sent) return; // người dùng đã đóng trong lúc chờ detect()
  if (data) {
    handleQR(data);
    return;
  }
  timer = setTimeout(scanLoop, CONFIG.nhipQuetMs);
}

function handleQR(raw) {
  if (sent) return;
  const text = String(raw || '').trim();
  if (!text) return;

  sent = true;
  scanning = false;
  setStatus('✅ Đã quét: ' + text);
  try { if (navigator.vibrate) navigator.vibrate(80); } catch (e) {}

  try {
    if (!window.opener || window.opener.closed) {
      setStatus('✅ Đã quét nhưng không còn cửa sổ Apps Script để nhận kết quả.');
      return;
    }

    const targetOrigin = document.referrer ? new URL(document.referrer).origin : '*';
    window.opener.postMessage({
      type: 'QR_LOCATION_SCANNED',
      raw: text
    }, targetOrigin);

    setTimeout(() => {
      try { window.close(); } catch(e) {}
    }, 250);
  } catch (e) {
    console.error(e);
    setStatus('❌ Không gửi được kết quả về trang kho.');
    sent = false;
    scanning = true;
    scanLoop();
  }
}

window.addEventListener('beforeunload', stopCamera);
startCamera();
</script>
</body>
</html>
